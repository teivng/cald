[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cald"
version = "0.1.0"
description = "CALD: detecting harmful distribution shift for tabular foundation models via calibrated anchor-loss disagreement"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "huggingface_hub>=0.20",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
examples = ["scikit-learn>=1.3", "ucimlrepo", "folktables"]
test = ["pytest>=7", "scikit-learn>=1.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/cald"]

# Ship the pinned nanoTabICL upstream source (git submodule, BSD-3) inside the
# wheel so installed packages do not depend on the repo checkout.
[tool.hatch.build.targets.wheel.force-include]
"third_party/nanotabicl/model.py" = "cald/_upstream/nanotabicl/model.py"
"third_party/nanotabicl/LICENSE" = "cald/_upstream/nanotabicl/LICENSE"

[tool.hatch.build.targets.sdist]
include = ["src/cald", "third_party/nanotabicl", "README.md", "LICENSE", "tests", "examples"]
